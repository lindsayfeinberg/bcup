name: iOS CI

on:
  push:
    branches: [main]
    paths: [ios/**]
  pull_request:
    branches: [main]
    paths: [ios/**]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build
        run: |
          xcodebuild build \
            -project ios/bcup.xcodeproj \
            -scheme bcup \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project ios/bcup.xcodeproj \
            -scheme bcup \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO