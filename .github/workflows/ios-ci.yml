name: iOS CI

on:
  push:
    branches: [main]
    paths: [ios/**]
  pull_request:
    branches: [main]
    paths: [ios/**]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project ios/bitchcup/bitchcup.xcodeproj \
            -scheme bitchcup \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project ios/bitchcup/bitchcup.xcodeproj \
            -scheme bitchcup \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO