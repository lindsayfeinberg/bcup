name: Functions CI

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"

jobs:
  functions-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present