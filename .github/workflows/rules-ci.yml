name: Firestore and Storage rules CI

on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/rules-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/rules-ci.yml"

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firebase/tests/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install deps
        run: npm ci

      - name: Rules integration tests
        run: npm test
